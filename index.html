<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="원하는 범위와 개수를 지정하여 무작위 숫자를 추첨하는 화려한 고성능 웹 서비스입니다.">
    <title>럭키 드로우 - 무작위 숫자 뽑기</title>
    <!-- 구글 폰트 적용 (Outfit, Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-globes">
        <!-- 배경의 은은한 네온 애니메이션 구체들 -->
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <div class="app-container">
        <!-- 헤더 영역 -->
        <header class="app-header">
            <div class="logo-icon">🎰</div>
            <h1 class="app-title">LUCKY DRAW</h1>
            <p class="app-subtitle">원하는 범위와 개수를 입력하고 행운의 숫자를 뽑아보세요!</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <!-- 설정 카드 패널 -->
            <section class="card config-card">
                <h2 class="card-title">⚙️ 추첨 설정</h2>

                <form id="drawForm" onsubmit="return false;">
                    <!-- 범위 입력 (최소값 ~ 최대값) -->
                    <div class="input-group-row">
                        <div class="input-field">
                            <label for="minNum">최소 숫자</label>
                            <input type="number" id="minNum" value="1" placeholder="예: 1" required>
                        </div>
                        <div class="range-separator">~</div>
                        <div class="input-field">
                            <label for="maxNum">최대 숫자</label>
                            <input type="number" id="maxNum" value="45" placeholder="예: 45" required>
                        </div>
                    </div>

                    <!-- 뽑을 개수 입력 -->
                    <div class="input-field margin-top">
                        <label for="countNum">뽑을 숫자 개수</label>
                        <input type="number" id="countNum" value="6" min="1" placeholder="예: 6" required>
                    </div>

                    <!-- 제외할 숫자 입력 (신규 추가) -->
                    <div class="input-field margin-top">
                        <label for="excludeNums">
                            제외할 숫자 <span class="label-tip">(쉼표, 공백으로 구분)</span>
                        </label>
                        <input type="text" id="excludeNums" placeholder="예: 3, 7, 12">
                    </div>

                    <!-- 추가 옵션 설정 -->
                    <div class="options-grid margin-top">
                        <!-- 중복 허용 여부 -->
                        <div class="option-item">
                            <label class="toggle-switch">
                                <input type="checkbox" id="allowDuplicates">
                                <span class="slider"></span>
                            </label>
                            <span class="option-label">중복 허용</span>
                        </div>

                        <!-- 효과음 켜기/끄기 -->
                        <div class="option-item">
                            <label class="toggle-switch">
                                <input type="checkbox" id="soundToggle" checked>
                                <span class="slider"></span>
                            </label>
                            <span class="option-label">효과음 🔊</span>
                        </div>
                    </div>

                    <!-- 정렬 옵션 -->
                    <div class="input-field margin-top">
                        <label for="sortOrder">결과 정렬 방식</label>
                        <select id="sortOrder">
                            <option value="none">무작위 (추첨된 순서대로)</option>
                            <option value="asc">오름차순 (작은 숫자부터)</option>
                            <option value="desc">내림차순 (큰 숫자부터)</option>
                        </select>
                    </div>

                    <!-- 추첨 버튼 -->
                    <button type="button" id="drawBtn" class="primary-btn">
                        <span class="btn-text">🎲 숫자 뽑기 시작!</span>
                    </button>
                </form>
            </section>

            <!-- 결과 및 디스플레이 카드 패널 -->
            <section class="card result-card">
                <div class="result-header">
                    <h2 class="card-title">🎉 추첨 결과</h2>
                    <button id="copyBtn" class="secondary-btn small-btn" disabled>
                        📋 결과 복사
                    </button>
                </div>

                <!-- 숫자가 등장할 디스플레이 공간 -->
                <div id="resultDisplay" class="result-display">
                    <div class="placeholder-text">
                        <span class="placeholder-icon">✨</span>
                        <p>설정을 입력한 후 <strong>'숫자 뽑기 시작'</strong> 버튼을 눌러주세요.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 히스토리 영역 -->
        <section class="card history-card">
            <div class="history-header">
                <h3 class="history-title">📜 최근 추첨 기록</h3>
                <button id="clearHistoryBtn" class="danger-btn small-btn">기록 삭제</button>
            </div>
            <ul id="historyList" class="history-list">
                <li class="empty-history">아직 추첨 기록이 없습니다.</li>
            </ul>
        </section>

        <!-- 푸터 -->
        <footer class="app-footer">
            <p>© 2026 Lucky Draw App. All rights reserved.</p>
        </footer>
    </div>

    <!-- 자바스크립트 연결 -->
    <script src="app.js"></script>
</body>
</html>
